<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vida">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Vida Tracker</title>
<style>
:root{
  color-scheme:dark;
  --bg:#000000;--s1:#151517;--s2:#1f1f22;--s3:#2c2c2e;--line:#2c2c2e;--axis:#3a3a3c;
  --ink:#fff;--ink2:#c3c2b7;--muted:#898781;
  --salud:#30d158;--mente:#a78bfa;--dinero:#ffd60a;--habitos:#f2f2f7;
  --good:#30d158;--warn:#fab219;--bad:#ff4d2e;--pos:#f2f2f7;--neg:#ff6961;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom));overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
#view{max-width:560px;margin:0 auto;padding:8px 16px 24px}
h1{font-size:28px;margin:14px 0 6px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;margin:0 0 8px}
.card{background:var(--s1);border:1px solid rgba(255,255,255,.07);border-radius:var(--r);padding:16px;margin:12px 0}
.card h2{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:8px}
.card h2 .pct{margin-left:auto;font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums}
.card h3{font-size:15px;margin:14px 0 8px;color:var(--ink2)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 8px var(--c)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.card h2+.row,.row.first{border-top:0}
.col{padding:10px 0;border-top:1px solid var(--line)}
.lbl{color:var(--ink2);font-size:15px;display:flex;align-items:center;gap:6px}
.lbl small{color:var(--muted)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button,.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:var(--s3);color:var(--ink);font-size:20px;line-height:1}
.stepper .val{min-width:66px;text-align:center;font-weight:650;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;margin-top:8px}
.seg button{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--s2);color:var(--ink2);font-size:16px;transition:.15s}
.seg button.on{background:var(--c,var(--habitos));color:#fff;border-color:transparent;box-shadow:0 0 14px -3px var(--c,var(--habitos))}
.seg.emo button{font-size:24px;filter:grayscale(1);opacity:.55}
.seg.emo button.on{filter:none;opacity:1}
.scale-cap{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--s2);color:var(--ink2);border-radius:999px;padding:8px 12px;font-size:14px}
.chip.on{background:var(--c,var(--habitos));color:#fff;border-color:transparent;box-shadow:0 0 12px -3px var(--c)}
.drops{display:flex;flex-wrap:wrap;gap:2px;margin-top:6px}
.drops button{font-size:21px;background:none;border:0;padding:1px;opacity:.22;filter:grayscale(1);transition:.15s}
.drops button.on{opacity:1;filter:drop-shadow(0 0 6px #f2f2f7)}
.txt,select.txt{background:var(--s2);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;width:100%}
textarea.txt{min-height:70px;resize:vertical}
.num{width:120px;text-align:right}
.btn{border:1px solid var(--line);background:var(--s3);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;font-weight:600}
.btn.primary{background:var(--c,var(--habitos));border-color:transparent;box-shadow:0 0 16px -4px var(--c,var(--habitos))}
.btn.danger{color:#ff6961}
.btn.full{width:100%;margin-top:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btns .btn{flex:1}
.datenav{display:flex;align-items:center;justify-content:space-between;margin:8px 0 0}
.datenav div{text-align:center}
.datenav b{font-size:24px;display:block;letter-spacing:-.02em}
.datenav small{color:var(--muted)}
.datenav button{width:44px;height:44px;border-radius:50%;border:0;background:var(--s1);color:var(--ink);font-size:24px}
.datenav button:disabled{opacity:.25}
.hero{display:flex;align-items:center;gap:14px}
.rings{flex:none}
.hleg{flex:1;display:grid;gap:8px}
.hl{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}
.hl b{margin-left:auto;color:var(--ink);font-variant-numeric:tabular-nums}
.pillrow{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--s1);border:1px solid rgba(255,255,255,.07);border-radius:999px;padding:6px 11px;font-size:13px;color:var(--ink2)}
.pill b{color:var(--ink)}
.xpbox{margin:10px 0 0}
.xpbox small{color:var(--muted);font-size:12px}
.xp{height:8px;background:var(--s3);border-radius:4px;overflow:hidden;margin-bottom:4px}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--habitos),var(--mente));border-radius:4px;box-shadow:0 0 10px var(--mente)}
.habits{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.habit{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--s2);color:var(--ink2);border-radius:14px;padding:10px;font:inherit;font-size:14px;min-height:52px;transition:.15s}
.habit .e{font-size:22px;filter:grayscale(1);opacity:.6}
.habit small{display:block;color:var(--muted);font-size:11px}
.habit.on{background:color-mix(in srgb,var(--habitos) 22%,var(--s2));border-color:var(--habitos);color:#fff;box-shadow:0 0 14px -5px var(--habitos)}
.habit.on .e{filter:none;opacity:1}
.amount{display:flex;align-items:center;gap:8px;margin-top:10px}
.amount input{font-size:28px;font-weight:700;text-align:right;padding:8px 12px}
.amount span{font-size:24px;color:var(--muted)}
.tx{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.tx .e{font-size:20px}
.tx .n{flex:1;min-width:0}
.tx .n small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx b{font-variant-numeric:tabular-nums}
.tx .x{background:none;border:0;color:var(--muted);font-size:20px;width:32px;height:32px}
.in{color:#30d158}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin-top:10px;background:var(--s2);border:1px solid var(--line);color:var(--ink2);border-radius:12px;padding:12px;font:inherit;font-size:15px}
.toggle i{width:44px;height:26px;border-radius:13px;background:var(--s3);position:relative;flex:none;transition:.2s}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on i{background:var(--c,var(--good))}
.toggle.on i::after{left:21px}
.bar{height:10px;background:var(--s3);border-radius:5px;overflow:hidden;display:flex;gap:2px}
.bar i{display:block;height:100%;border-radius:5px}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{background:var(--s1);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:12px 14px}
.tile .k{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.tile .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:2px 0}
.tile .v small{font-size:14px;color:var(--muted);font-weight:500}
.tile .d{font-size:12px;color:var(--muted)}
.d.good{color:#30d158}.d.bad{color:#ff6961}
.tiles.three{grid-template-columns:1fr 1fr 1fr}
.tiles.three .v{font-size:19px}
.cwrap{position:relative}
.cwrap svg{display:block;touch-action:pan-y;overflow:visible}
.ax{fill:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}
.tip{position:absolute;top:-6px;left:0;display:none;pointer-events:none;background:#2c2c2e;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:6px 9px;font-size:12px;line-height:1.45;white-space:nowrap;z-index:3;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.tip b{font-weight:650}
.tip .sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);margin-top:8px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%}
.legend i.dash{border-radius:0;height:2px;width:14px;background:none;border-top:2px dashed var(--muted)}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:26px 0}
.rangeseg{display:flex;background:var(--s1);border-radius:12px;padding:3px;gap:3px;margin:8px 0}
.rangeseg button{flex:1;border:0;background:none;color:var(--muted);border-radius:9px;padding:8px 0;font:inherit;font-size:14px;font-weight:600}
.rangeseg button.on{background:var(--s3);color:var(--ink)}
.hbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px 10px;font-size:14px}
.hbar .t{height:12px;background:var(--s2);border-radius:0 6px 6px 0}
.hbar .t i{display:block;height:100%;border-radius:0 6px 6px 0;background:var(--dinero)}
.hbar .val{font-variant-numeric:tabular-nums;color:var(--ink);text-align:right}
.corr{padding:10px 0;border-top:1px solid var(--line)}
.corr:first-of-type{border-top:0}
.corr p{margin:0 0 8px;font-size:15px;color:var(--ink2)}
.corr p b{color:var(--ink)}
.cbar{position:relative;height:8px;background:var(--s2);border-radius:4px}
.cbar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--axis)}
.cbar i{position:absolute;top:0;bottom:0;border-radius:4px}
.corr small{color:var(--muted);font-size:12px}
.radar-tab{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:13px;color:var(--ink2);margin-top:8px}
.radar-tab span{display:flex;justify-content:space-between}
.radar-tab b{color:var(--ink);font-variant-numeric:tabular-nums}
.months{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.month h4{margin:0 0 4px;font-size:13px;color:var(--ink2);font-weight:600;text-transform:capitalize}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mgrid .wd{font-size:9px;color:var(--muted);text-align:center}
.cell{aspect-ratio:1;border-radius:4px;border:0;padding:0;background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.cell.has{box-shadow:none}
.cell.fut{visibility:hidden}
.cell.today{outline:2px solid #fff;outline-offset:-1px}
.cell.sel{outline:2px solid var(--warn);outline-offset:0}
.ramp{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.ramp i{width:14px;height:14px;border-radius:3px}
.calbar{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.detail .kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:14px;color:var(--ink2);margin:8px 0}
.detail .kv b{color:var(--ink)}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.badge{background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;font-size:12px;color:var(--muted)}
.badge .e{font-size:30px;display:block;filter:grayscale(1);opacity:.3}
.badge b{display:block;font-size:12px;color:var(--ink2);margin:2px 0}
.badge.ok{border-color:rgba(250,178,25,.5);background:linear-gradient(180deg,rgba(250,178,25,.12),var(--s2));color:var(--ink2)}
.badge.ok .e{filter:drop-shadow(0 0 8px rgba(250,178,25,.6));opacity:1}
.badge.ok b{color:#fff}
.lvl{display:flex;align-items:center;gap:16px}
.lvl .big{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:800;background:radial-gradient(circle at 30% 30%,#a78bfa,#f2f2f7 70%);box-shadow:0 0 28px -4px #a78bfa;flex:none}
.lvl .t{font-size:20px;font-weight:700}
.goal{padding:12px 0;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:0}
.goal .top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.goal .top .n{flex:1;font-weight:600}
.goal .top small{color:var(--muted);font-variant-numeric:tabular-nums}
.goal .ctrl{display:flex;align-items:center;gap:8px;margin-top:8px}
.goal .ctrl .bar{flex:1}
.list-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.list-item:first-child{border-top:0}
.list-item span.n{flex:1}
.list-item small{color:var(--muted)}
.addrow{display:flex;gap:6px;margin-top:10px}
.addrow .emo{width:58px;text-align:center;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.grid2 label{font-size:13px;color:var(--muted);display:grid;gap:4px}
.banner{background:rgba(250,178,25,.12);border:1px solid rgba(250,178,25,.4);color:#ffd37a;border-radius:14px;padding:10px 12px;font-size:14px;display:flex;align-items:center;gap:10px;margin-top:10px}
.banner button{margin-left:auto;background:var(--warn);color:#151517;border:0;border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px;white-space:nowrap}
.welcome p{color:var(--ink2);margin:0}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.neg{color:#ff6961}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px}
.grid3 label{font-size:12px;color:var(--muted);display:grid;gap:4px}
.dbars{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;font-size:14px}
.dbars .t{position:relative;height:12px;background:var(--s2);border-radius:6px}
.dbars .t::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--axis)}
.dbars .t i{position:absolute;top:0;bottom:0;border-radius:6px}
.dbars .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.dbars small{display:block;color:var(--muted);font-size:11px;font-weight:400}
.pgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.pgrid .wd{font-size:10px;color:var(--muted);text-align:center}
.pcell{min-height:46px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line);padding:3px 4px;font-size:10px;color:var(--ink2);display:flex;flex-direction:column;justify-content:space-between}
.pcell.has{box-shadow:none;color:rgba(255,255,255,.8)}
.pcell b{font-size:11px;color:#fff;text-align:right;font-variant-numeric:tabular-nums}
.rec{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;color:var(--ink2)}
.rec:first-of-type{border-top:0}
.rec b{color:var(--ink);text-align:right}
.botrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.botrow:first-of-type{border-top:0}
.botrow .n{flex:1;min-width:0;font-weight:600}
.botrow .n small{display:block;color:var(--muted);font-weight:400;font-size:12px}
#tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:rgba(0,0,0,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
#tabs button{flex:1;min-width:0;background:none;border:0;color:var(--muted);font:inherit;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0}
#tabs .i{font-size:22px;filter:grayscale(1);opacity:.55;transition:.15s}
#tabs button.on{color:var(--ink)}
#tabs button.on .i{filter:drop-shadow(0 0 6px rgba(167,139,250,.7));opacity:1}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-150%);background:#2c2c2e;border:1px solid rgba(250,178,25,.5);box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 24px -6px rgba(250,178,25,.6);color:#fff;padding:12px 16px;border-radius:14px;font-weight:600;font-size:15px;transition:transform .35s cubic-bezier(.2,.9,.3,1.3);z-index:20;max-width:calc(100% - 32px);text-align:center}
#toast.show{transform:translate(-50%,0)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.pop{animation:pop .25s}

/* ===== tema minimal ===== */
html,body{background:#000}
body{padding-bottom:calc(108px + env(safe-area-inset-bottom))}
h1{font-size:30px;font-weight:700}
.card{border:0;border-radius:26px;padding:18px;background:#151517}
.tile{border:0;border-radius:22px;background:#151517}
.card h2{font-size:16px;font-weight:600}
.card h2 .pct,.sub,.note,.tile .k{color:#8e8e93}
.dot{box-shadow:none}
svg *{filter:none!important}
.seg button,.chip,.txt,.habit,.toggle{border-color:transparent;background:#1f1f22}
.seg button{border-radius:14px}
.seg button.on,.chip.on{background:#fff;color:#000;font-weight:600;box-shadow:none}
.seg.emo button.on{background:#3a3a3c}
.btn{border:0;border-radius:999px;background:#2c2c2e;padding:14px 16px}
.btn.primary{background:#fff;color:#000;font-weight:650;box-shadow:none}
.stepper button,.icon-btn{border-radius:50%;background:#2c2c2e}
.txt{border-radius:14px}
.txt:focus{outline:0;box-shadow:0 0 0 1.5px #636366}
.habit{border-radius:18px}
.habit.on{background:#2c2c2e;border-color:#8e8e93;box-shadow:none;color:#fff}
.drops button.on{filter:none}
.pill{border:0;background:#151517}
.rangeseg{border-radius:999px;padding:4px;background:#151517}
.rangeseg button{border-radius:999px}
.rangeseg button.on{background:#2c2c2e;color:#fff}
.datenav button{background:#151517}
.xp,.bar{background:#2c2c2e}
.xp i{background:#fff;box-shadow:none}
.bar i{box-shadow:none!important}
.lvl .big{background:#fff;color:#000;box-shadow:none}
.badge{border:0;border-radius:20px;background:#1f1f22}
.badge.ok{background:#2c2c2e;border:0}
.badge.ok .e{filter:none}
.cell{border-radius:999px;aspect-ratio:1.5}
.pcell{border-radius:12px}
.tag{font-size:12px;padding:4px 10px;border-radius:999px;border:1px dashed #636366;color:#c7c7cc;white-space:nowrap}
.sec{font-size:20px;margin:26px 0 4px;letter-spacing:-.01em}
.sub3{margin:16px 0 0;font-size:15px;color:#8e8e93}
.cheer{margin:10px 0 0;font-size:15px;color:#c7c7cc}
.tip{background:#2c2c2e;border:0;border-radius:12px}
.banner{border-radius:18px}
#toast{background:#2c2c2e;border:0;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#tabs{left:50%;right:auto;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(calc(100% - 28px),430px);border:0;border-radius:999px;padding:6px;background:rgba(38,38,40,.82);box-shadow:0 8px 30px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.07)}
#tabs button{border-radius:999px;padding:6px 0 5px;font-size:9px}
#tabs .i{font-size:20px}
#tabs button.on{background:rgba(255,255,255,.14);color:#fff}
#tabs button.on .i{filter:none}

/* ===== detalles dot-matrix ===== */
:root{--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;--acc:#ff4d2e}
#view{counter-reset:card}
h1{font-family:var(--mono);text-transform:uppercase;letter-spacing:.14em;font-size:22px;font-weight:500}
h1::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-left:10px;vertical-align:middle}

.tile .v,.stepper .val,.hl b,.tx b,.rec b,.botrow b,.dbars .val,.hbar .val,.pill b,.glow,.pcell,.amount input,.datenav small,.xpbox small,svg text,.goal .top small,.tile .d{font-family:var(--mono);letter-spacing:-.02em}

.datenav b{font-family:var(--mono);text-transform:uppercase;letter-spacing:.12em;font-size:20px;font-weight:500}

.neg,.d.bad{color:var(--acc)}
</style>

<body>

</nav>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
'use strict';
/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const today = () => keyOf(new Date());
const range = (end, n) => Array.from({ length: n }, (_, i) => addDays(end, i - n + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const avg = a => { const v = a.filter(x => x != null); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
const nf = (v, dec = 1) => v == null ? '—' : Number(v).toLocaleString('es-ES', { maximumFractionDigits: dec });
const eur = (v, dec = 2) => Number(v).toLocaleString('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: dec, minimumFractionDigits: dec === 0 ? 0 : 2 });
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sept', 'oct', 'nov', 'dic'];
const MESL = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const DOW = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const fmtShort = k => { const d = parseKey(k); return `${d.getDate()} ${MES[d.getMonth()]}`; };
const fmtLong = k => { const d = parseKey(k); return `${DOW[d.getDay()]} ${d.getDate()} de ${MESL[d.getMonth()]}`; };
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

const AREAS = {
  salud: { n: 'Salud', c: '#30d158', e: '💪' },
  mente: { n: 'Mente', c: '#a78bfa', e: '🧠' },
  dinero: { n: 'Dinero', c: '#ffd60a', e: '💶' },
  habitos: { n: 'Hábitos', c: '#f2f2f7', e: '🎯' },
};
const AREA_KEYS = Object.keys(AREAS);
const MOODS = ['😣', '😕', '😐', '🙂', '😄'];
const LEVEL_TITLES = ['Novato', 'Aprendiz', 'Constante', 'Enfocado', 'Disciplinado', 'Imparable', 'Maestro', 'Leyenda'];

/* ---------- estado ---------- */
const KEY = 'vida.v1';
const mk = list => list.map(([name, emoji]) => ({ id: uid(), name, emoji }));
function defaults() {
  return {
    goals: { sleep: 8, water: 8, steps: 8000, exercise: 30 },
    budget: 1200,
    habits: mk([['Leer', '📚'], ['Meditar', '🧘'], ['Sin pantallas 23h', '📵'], ['Fruta y verdura', '🥗'], ['Estirar', '🤸']]),
    expenseCats: mk([['Súper', '🛒'], ['Restaurantes', '🍽️'], ['Transporte', '🚌'], ['Casa', '🏠'], ['Ocio', '🎉'], ['Compras', '🛍️'], ['Salud', '💊'], ['Deudas', '💳'], ['Otros', '📦']]),
    incomeCats: mk([['Nómina', '💼'], ['Trading', '📊'], ['Extra', '✨'], ['Otros', '💰']]),
    custom: [],
    goalsList: [],
    sports: [{ id: 'run', name: 'Correr', emoji: '🏃' }, { id: 'gym', name: 'Gimnasio', emoji: '🏋️' }, { id: 'bike', name: 'Bici', emoji: '🚴' }, { id: 'swim', name: 'Natación', emoji: '🏊' }, { id: 'hike', name: 'Senderismo', emoji: '🥾' }],
    shoes: [],
    runWeekly: 15,
    debtAsExpense: true,
    accounts: [],
    setups: mk([['Breakout', '💥'], ['Pullback', '↩️'], ['Reversión', '🔄'], ['Rango', '📦'], ['Tendencia', '📈'], ['Noticias', '📰']]),
    tradeCur: 'USD',
    maxDailyLoss: 0,
  };
}
let S;
function normalize(s) {
  const d = defaults();
  s.days = s.days || {};
  s.debts = s.debts || [];
  s.config = Object.assign(d, s.config || {});
  s.config.goals = Object.assign(defaults().goals, s.config.goals || {});
  return s;
}
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  S = normalize(S && S.days ? S : { v: 1, days: {}, demo: false, welcomed: false });
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('⚠️ No se pudo guardar. Exporta una copia desde Yo.'); }
}
let saveT;
const saveSoon = () => { clearTimeout(saveT); saveT = setTimeout(save, 300); };

const U = { tab: 'hoy', cur: today(), range: 30, calMetric: 'score', calYear: new Date().getFullYear(), sel: null, month: today().slice(0, 7), txType: 'out', txCat: null, txAmt: '', txNote: '', explore: 'score',
  statsView: 'charts', moneyView: 'month', sport: 'all', wk: null, wkOpen: false, debtAmt: {}, tr: null, trOpen: false, trAcc: 'all', mv: { open: false, acc: null, type: 'wd', amt: '', date: today() }, na: null, trMonth: today().slice(0, 7), habitEdit: false };
const num = s => parseFloat(String(s ?? '').trim().replace(',', '.'));
function setU(p, v) { const parts = p.split('.'); let o = U; for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]] = o[parts[i]] || {}; o[parts[parts.length - 1]] = v; }

/* ---------- datos derivados ---------- */
function hasData(d) {
  if (!d) return false;
  for (const v of Object.values(d)) {
    if (v == null || v === '' || v === false) continue;
    if (Array.isArray(v)) { if (v.length) return true; continue; }
    if (typeof v === 'object') { if (Object.values(v).some(x => x != null && x !== false && x !== '')) return true; continue; }
    return true;
  }
  return false;
}
const sumTx = (d, type) => (d?.tx || []).filter(t => t.type === type).reduce((a, t) => a + t.amount, 0);
const moneyLogged = d => !!(d && ((d.tx && d.tx.length) || d.noSpend));
function habitPct(d) {
  const h = S.config.habits;
  if (!h.length) return null;
  return h.filter(x => d?.habits?.[x.id]).length / h.length;
}
function scores(d) {
  if (!d) return { salud: 0, mente: 0, dinero: 0, habitos: 0, total: 0 };
  const g = S.config.goals, r = (v, t) => v == null ? 0 : Math.min(1, v / t);
  const salud = (r(d.sleep, g.sleep) + r(d.water, g.water) + r(d.exercise, g.exercise) + r(d.steps, g.steps)) / 4;
  // Mente: la mitad por registrar, la otra mitad por cómo estás
  const m = (v, inv) => v == null ? 0 : .5 + .5 * (inv ? 5 - v : v - 1) / 4;
  const mente = (m(d.mood) + m(d.energy) + m(d.stress, true)) / 3;
  let dinero = 0;
  if (moneyLogged(d)) {
    const sp = sumTx(d, 'out'), daily = S.config.budget / 30.4;
    dinero = sp <= daily ? 1 : Math.max(.3, daily / sp);
  }
  const habitos = habitPct(d) || 0;
  return { salud, mente, dinero, habitos, total: (salud + mente + dinero + habitos) / 4 };
}
function metrics() {
  const L = [
    { id: 'score', n: 'Puntuación del día', u: '%', a: 'habitos', get: d => hasData(d) ? Math.round(scores(d).total * 100) : null, min: 0, max: 100, dec: 0 },
    { id: 'sleep', n: 'Sueño', u: 'h', a: 'salud', get: d => d?.sleep },
    { id: 'exercise', n: 'Ejercicio', u: 'min', a: 'salud', get: d => d?.exercise, dec: 0 },
    { id: 'steps', n: 'Pasos', u: '', a: 'salud', get: d => d?.steps, dec: 0 },
    { id: 'water', n: 'Agua', u: 'vasos', a: 'salud', get: d => d?.water, dec: 0 },
    { id: 'weight', n: 'Peso', u: 'kg', a: 'salud', get: d => d?.weight },
    { id: 'mood', n: 'Ánimo', u: '/5', a: 'mente', get: d => d?.mood, min: 1, max: 5 },
    { id: 'energy', n: 'Energía', u: '/5', a: 'mente', get: d => d?.energy, min: 1, max: 5 },
    { id: 'stress', n: 'Estrés', u: '/5', a: 'mente', get: d => d?.stress, min: 1, max: 5 },
    { id: 'spent', n: 'Gasto', u: '€', a: 'dinero', get: d => moneyLogged(d) ? sumTx(d, 'out') : null, dec: 2 },
    { id: 'habits', n: 'Hábitos cumplidos', u: '%', a: 'habitos', get: d => { if (!hasData(d)) return null; const p = habitPct(d); return p == null ? null : Math.round(p * 100); }, min: 0, max: 100, dec: 0 },
    { id: 'km', n: 'Km de deporte', nl: 'km de deporte', u: 'km', a: 'salud', get: d => d?.workouts?.length ? sumBy(d.workouts, w => w.dist) : (hasData(d) ? 0 : null) },
    { id: 'trade', n: 'P&L de trading', nl: 'P&L de trading', u: S.config.tradeCur, a: 'dinero', get: d => d?.trades?.length ? sumBy(d.trades, t => t.pnl) : null, dec: 2 },
  ];
  for (const c of S.config.custom) {
    const get = c.type === 'bool' ? (d => d?.custom?.[c.id] ? 1 : (hasData(d) ? 0 : null)) : (d => d?.custom?.[c.id]);
    L.push({ id: 'c_' + c.id, n: c.name, u: c.type === 'scale' ? '/5' : c.type === 'bool' ? '' : (c.unit || ''), a: c.area, get, min: c.type === 'scale' ? 1 : c.type === 'bool' ? 0 : undefined, max: c.type === 'scale' ? 5 : c.type === 'bool' ? 1 : undefined, custom: c });
  }
  return L;
}
const metricById = id => metrics().find(m => m.id === id) || metrics()[0];

function streak(test) {
  let k = today();
  if (!test(S.days[k])) k = addDays(k, -1);
  let n = 0;
  while (test(S.days[k])) { n++; k = addDays(k, -1); }
  return n;
}
function bestStreak(test) {
  const ks = Object.keys(S.days).sort();
  let best = 0, cur = 0, prev = null;
  for (const k of ks) {
    if (test(S.days[k])) { cur = prev && addDays(prev, 1) === k ? cur + 1 : 1; prev = k; best = Math.max(best, cur); }
    else { cur = 0; prev = null; }
  }
  return best;
}
function achievements() {
  const ks = Object.keys(S.days).filter(k => hasData(S.days[k])).sort();
  const D = ks.map(k => S.days[k]), n = ks.length, g = S.config.goals;
  const best = bestStreak(hasData);
  const cnt = f => D.filter(f).length;
  const run = f => bestStreak(d => hasData(d) && f(d));
  const byMonth = {};
  for (const k of ks) { const m = k.slice(0, 7); if (m === today().slice(0, 7)) continue; const d = S.days[k]; if (!moneyLogged(d)) continue; (byMonth[m] = byMonth[m] || { days: 0, sp: 0 }); byMonth[m].days++; byMonth[m].sp += sumTx(d, 'out'); }
  const saver = Object.values(byMonth).some(m => m.days >= 20 && m.sp <= S.config.budget);
  const runs = allOf('workouts').filter(w => w.sport === 'run'), TR = allOf('trades');
  let greenBest = 0, greenCur = 0;
  for (const k of ks) { const t = S.days[k].trades; if (!t?.length) continue; greenCur = sumBy(t, x => x.pnl) > 0 ? greenCur + 1 : 0; greenBest = Math.max(greenBest, greenCur); }
  return [
    { e: '🌱', n: 'Primer paso', t: 'Tu primer check-in', ok: n >= 1 },
    { e: '🔥', n: 'Calentando', t: 'Racha de 3 días', ok: best >= 3 },
    { e: '⚡', n: 'Semana redonda', t: 'Racha de 7 días', ok: best >= 7 },
    { e: '🌙', n: 'Mes de hierro', t: 'Racha de 30 días', ok: best >= 30 },
    { e: '💎', n: 'Centenario', t: 'Racha de 100 días', ok: best >= 100 },
    { e: '📅', n: 'Cincuentena', t: '50 días registrados', ok: n >= 50 },
    { e: '🌟', n: 'Día perfecto', t: 'Puntuación del día ≥ 90%', ok: D.some(d => scores(d).total >= .9) },
    { e: '🎯', n: 'Pleno', t: 'Todos los hábitos en un día', ok: D.some(d => habitPct(d) === 1) },
    { e: '😴', n: 'Bella durmiente', t: `Dormir ${nf(g.sleep)}h+ 7 días seguidos`, ok: run(d => d.sleep >= g.sleep) >= 7 },
    { e: '💧', n: 'Hidratación', t: 'Meta de agua 7 días seguidos', ok: run(d => d.water >= g.water) >= 7 },
    { e: '🏃', n: 'En movimiento', t: 'Meta de ejercicio 10 días', ok: cnt(d => d.exercise >= g.exercise) >= 10 },
    { e: '👣', n: 'Caminante', t: 'Meta de pasos 20 días', ok: cnt(d => d.steps >= g.steps) >= 20 },
    { e: '🧘', n: 'Zen', t: 'Estrés ≤ 2 siete días seguidos', ok: run(d => d.stress != null && d.stress <= 2) >= 7 },
    { e: '😄', n: 'Buena onda', t: 'Ánimo ≥ 4 cinco días seguidos', ok: run(d => d.mood >= 4) >= 5 },
    { e: '🐷', n: 'Ahorrador', t: 'Un mes completo bajo presupuesto', ok: saver },
    { e: '✍️', n: 'Escritor', t: '20 notas en el diario', ok: cnt(d => d.note && d.note.trim()) >= 20 },
    { e: '👟', n: 'Primera salida', t: 'Tu primera carrera', ok: runs.length >= 1 },
    { e: '🥉', n: '5K', t: 'Correr 5 km seguidos', ok: runs.some(w => w.dist >= 5) },
    { e: '🥈', n: '10K', t: 'Correr 10 km seguidos', ok: runs.some(w => w.dist >= 10) },
    { e: '🥇', n: 'Media maratón', t: 'Correr 21,1 km', ok: runs.some(w => w.dist >= 21.09) },
    { e: '💯', n: 'Centenario runner', t: '100 km corridos en total', ok: sumBy(runs, w => w.dist) >= 100 },
    { e: '📓', n: 'Diario de trading', t: 'Registrar 10 operaciones', ok: TR.length >= 10 },
    { e: '🧠', n: 'Trader disciplinado', t: '20 operaciones siguiendo el plan', ok: TR.filter(t => t.plan === true).length >= 20 },
    { e: '🟩', n: 'Racha verde', t: '5 días de trading seguidos en positivo', ok: greenBest >= 5 },
    { e: '🎉', n: 'Deuda saldada', t: 'Terminar de pagar una deuda', ok: S.debts.some(x => x.kind === 'owe' && x.moves.length && debtCalc(x).pending <= 0) },
    { e: '🏦', n: 'Trader fondeado', t: 'Aprobar un examen de fondeo', ok: S.config.accounts.some(a => a.kind === 'prop' && a.fundedAt) },
    { e: '💸', n: 'Primer retiro', t: 'Cobrar tu primer retiro de trading', ok: S.config.accounts.some(a => (a.moves || []).some(m => m.type === 'wd')) },
  ];
}
function xpTotal(ach = achievements()) {
  let x = 0;
  for (const k in S.days) { const d = S.days[k]; if (hasData(d)) x += 10 + Math.round(scores(d).total * 90); }
  return x + ach.filter(a => a.ok).length * 100;
}
function levelOf(xp) {
  const L = Math.floor(Math.sqrt(xp / 150)) + 1, a = 150 * (L - 1) ** 2, b = 150 * L ** 2;
  return { L, pct: (xp - a) / (b - a), toNext: b - xp, title: LEVEL_TITLES[Math.min(LEVEL_TITLES.length - 1, Math.floor((L - 1) / 3))] };
}
function checkUnlocks(silent) {
  const ach = achievements(), ok = ach.filter(a => a.ok).map(a => a.n), lv = levelOf(xpTotal(ach)).L;
  if (!silent && S.unlocked) {
    const nw = ach.filter(a => a.ok && !S.unlocked.includes(a.n));
    if (nw.length) toast(`🏆 ¡Logro desbloqueado! ${nw[0].e} ${nw[0].n}`);
    else if (S.level && lv > S.level) toast(`⭐ ¡Subes a nivel ${lv}!`);
  }
  S.unlocked = ok; S.level = lv; save();
}

/* ---------- mutaciones ---------- */
const dayObj = k => S.days[k] || (S.days[k] = {});
function getVal(d, p) { const [a, b] = p.split('.'); return b ? d?.[a]?.[b] : d?.[a]; }
function setVal(k, p, v) {
  const d = dayObj(k), [a, b] = p.split('.');
  if (b) { d[a] = d[a] || {}; if (v == null || v === '') delete d[a][b]; else d[a][b] = v; }
  else { if (v == null || v === '') delete d[a]; else d[a] = v; }
  if (!hasData(d)) delete S.days[k];
}
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}
const catList = type => type === 'in' ? S.config.incomeCats : S.config.expenseCats;
const catOf = (type, id) => catList(type).find(c => c.id === id) || { name: 'Otros', emoji: type === 'in' ? '💰' : '📦' };

/* ---------- gráficos ---------- */
function niceTicks(min, max, n = 4) {
  const span = (max - min) || 1, raw = span / n, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s >= raw);
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
  for (let v = lo; v <= hi + step / 1e6; v += step) t.push(+v.toFixed(6));
  return { lo, hi, t };
}
function rolling(vals, w) {
  return vals.map((_, i) => avg(vals.slice(Math.max(0, i - w + 1), i + 1)));
}
function barPath(x, y, w, h, r) {
  r = Math.min(r, h, w / 2);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
function hover(el, W, n, xOf, html, onIdx) {
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip');
  const move = e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
    let best = 0, bd = 1e9;
    for (let i = 0; i < n; i++) { const dd = Math.abs(xOf(i) - px); if (dd < bd) { bd = dd; best = i; } }
    const h = html(best);
    if (!h) { tip.style.display = 'none'; onIdx && onIdx(null); return; }
    tip.innerHTML = h; tip.style.display = 'block';
    const x = xOf(best) * r.width / W, tw = tip.offsetWidth;
    tip.style.left = clamp(x - tw / 2, 0, r.width - tw) + 'px';
    onIdx && onIdx(best);
  };
  svg.addEventListener('pointerdown', move);
  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { tip.style.display = 'none'; onIdx && onIdx(null); } });
}
const legendHTML = series => series.length < 2 ? '' : `<div class="legend">${series.map(s => `<span>${s.dash ? '<i class="dash"></i>' : `<i style="background:${s.color}"></i>`}${esc(s.name)}</span>`).join('')}</div>`;

function mountLine(el, { keys, series, min, max, goal, unit = '', dec = 1, smooth = false, fmt, tickFmt }) {
  if (!el) return;
  const W = Math.max(260, el.clientWidth), H = 180, pl = 40, pr = 12, pt = 16, pb = 24;
  const SS = series.map(s => ({ ...s, vals: smooth ? rolling(s.vals, 7) : s.vals }));
  const all = SS.flatMap(s => s.vals).filter(v => v != null);
  if (!all.length) { el.innerHTML = '<div class="empty">Aún no hay datos en este periodo</div>'; return; }
  let lo = min ?? Math.min(...all, goal ?? Infinity), hi = max ?? Math.max(...all, goal ?? -Infinity);
  if (min == null || max == null) { const p = (hi - lo) * .12 || 1; const tk = niceTicks(min == null ? lo - p : lo, max == null ? hi + p : hi); if (min == null) lo = Math.max(tk.lo, all.every(v => v >= 0) ? 0 : -Infinity); if (max == null) hi = tk.hi; }
  const ticks = niceTicks(lo, hi).t.filter(v => v >= lo - 1e-9 && v <= hi + 1e-9);
  const n = keys.length, iw = W - pl - pr, ih = H - pt - pb;
  const X = i => pl + (n <= 1 ? iw / 2 : i * iw / (n - 1)), Y = v => pt + ih * (1 - (v - lo) / ((hi - lo) || 1));
  let g = '';
  for (const t of ticks) g += `<line x1="${pl}" x2="${W - pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text class="ax" x="${pl - 6}" y="${Y(t) + 3.5}" text-anchor="end">${tickFmt ? tickFmt(t) : nf(t, 1)}</text>`;
  if (goal != null && goal >= lo && goal <= hi) g += `<line x1="${pl}" x2="${W - pr}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="var(--ink2)" stroke-dasharray="4 4" opacity=".6"/><text class="ax" x="${W - pr}" y="${Y(goal) - 4}" text-anchor="end">meta ${nf(goal)}</text>`;
  const xi = [...new Set([0, Math.floor((n - 1) / 2), n - 1])];
  xi.forEach((i, j) => g += `<text class="ax" x="${X(i)}" y="${H - 6}" text-anchor="${j === 0 ? 'start' : j === xi.length - 1 ? 'end' : 'middle'}">${fmtShort(keys[i])}</text>`);
  for (const s of SS) {
    let d = '', seg = [];
    const flush = () => { if (seg.length === 1) g += `<circle cx="${X(seg[0][0])}" cy="${Y(seg[0][1])}" r="3" fill="${s.color}"/>`; seg = []; };
    s.vals.forEach((v, i) => { if (v == null) { flush(); return; } d += (seg.length ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(v).toFixed(1); seg.push([i, v]); });
    flush();
    if (d) g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="4 4"' : ''} style="filter:drop-shadow(0 0 3px ${s.color}88)"/>`;
  }
  g += `<g class="cross" style="display:none"><line y1="${pt}" y2="${H - pb}" stroke="var(--ink2)" stroke-width="1"/>${SS.map(s => `<circle r="4.5" fill="${s.color}" stroke="var(--s1)" stroke-width="2"/>`).join('')}</g>`;
  el.innerHTML = `<div class="cwrap"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${g}<rect x="${pl - 10}" y="0" width="${iw + 20}" height="${H}" fill="transparent"/></svg><div class="tip"></div></div>${legendHTML(series)}`;
  const cross = el.querySelector('.cross'), cl = cross.querySelector('line'), cc = cross.querySelectorAll('circle');
  hover(el, W, n, X, i => {
    const rows = SS.filter(s => s.vals[i] != null).map(s => `<div><span class="sw" style="background:${s.color}"></span>${SS.length > 1 ? esc(s.name) + ': ' : ''}<b>${fmt ? fmt(s.vals[i]) : nf(s.vals[i], dec) + (unit ? ' ' + unit : '')}</b></div>`);
    return `<div>${cap(fmtLong(keys[i]))}${smooth ? ' · media 7d' : ''}</div>` + (rows.join('') || '<div style="color:var(--muted)">Sin datos</div>');
  }, i => {
    if (i == null) { cross.style.display = 'none'; return; }
    cross.style.display = ''; cl.setAttribute('x1', X(i)); cl.setAttribute('x2', X(i));
    SS.forEach((s, j) => { const v = s.vals[i]; cc[j].style.display = v == null ? 'none' : ''; if (v != null) { cc[j].setAttribute('cx', X(i)); cc[j].setAttribute('cy', Y(v)); } });
  });
}

function mountBars(el, { labels, series, ref, refLabel, fmt = v => nf(v), tipTitle, allLabels = false }) {
  if (!el) return;
  const W = Math.max(260, el.clientWidth), H = 170, pl = 44, pr = 10, pt = 16, pb = 24;
  const all = series.flatMap(s => s.vals).filter(v => v != null);
  if (!all.length || (Math.max(...all) === 0 && !ref)) { el.innerHTML = '<div class="empty">Aún no hay datos en este periodo</div>'; return; }
  const tk = niceTicks(0, Math.max(...all, ref || 0) * 1.08 || 1), hi = tk.hi;
  const n = labels.length, m = series.length, iw = W - pl - pr, ih = H - pt - pb, slot = iw / n;
  const bw = Math.max(2, Math.min(22, (slot - 4) / m - (m > 1 ? 2 : 0)));
  const Y = v => pt + ih * (1 - v / hi), X = i => pl + i * slot + slot / 2;
  let g = '';
  for (const t of tk.t) g += `<line x1="${pl}" x2="${W - pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="${t === 0 ? 'var(--axis)' : 'var(--line)'}"/><text class="ax" x="${pl - 6}" y="${Y(t) + 3.5}" text-anchor="end">${fmt(t)}</text>`;
  series.forEach((s, j) => s.vals.forEach((v, i) => {
    if (!v) return;
    const x = X(i) - (m * bw + (m - 1) * 2) / 2 + j * (bw + 2);
    g += `<path d="${barPath(x, Y(v), bw, ih * v / hi, 4)}" fill="${s.color}"/>`;
  }));
  if (ref) g += `<line x1="${pl}" x2="${W - pr}" y1="${Y(ref)}" y2="${Y(ref)}" stroke="var(--ink2)" stroke-dasharray="4 4" opacity=".7"/><text class="ax" x="${W - pr}" y="${Y(ref) - 4}" text-anchor="end">${esc(refLabel || '')}</text>`;
  const xi = allLabels ? labels.map((_, i) => i) : [...new Set([0, Math.floor((n - 1) / 2), n - 1])];
  xi.forEach(i => g += `<text class="ax" x="${X(i)}" y="${H - 6}" text-anchor="middle">${esc(labels[i])}</text>`);
  g += `<rect class="hl" y="${pt}" height="${ih}" width="${slot}" fill="rgba(255,255,255,.06)" rx="4" style="display:none"/>`;
  el.innerHTML = `<div class="cwrap"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${g}<rect x="${pl}" y="0" width="${iw}" height="${H}" fill="transparent"/></svg><div class="tip"></div></div>${legendHTML(series)}`;
  const hl = el.querySelector('.hl');
  hover(el, W, n, X, i => `<div>${esc(tipTitle ? tipTitle(i) : labels[i])}</div>` + series.map(s => `<div><span class="sw" style="background:${s.color}"></span>${m > 1 ? esc(s.name) + ': ' : ''}<b>${s.vals[i] == null ? '—' : fmt(s.vals[i], true)}</b></div>`).join(''),
    i => { if (i == null) { hl.style.display = 'none'; return; } hl.style.display = ''; hl.setAttribute('x', pl + i * slot); });
}

function mountRadar(el, { axes, series }) {
  if (!el) return;
  const W = Math.min(340, Math.max(260, el.clientWidth)), H = W * .86, cx = W / 2, cy = H / 2 + 4, R = W * .3, n = axes.length;
  const P = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * R * v, cy + Math.sin(a) * R * v]; };
  let g = '';
  for (const lv of [.25, .5, .75, 1]) g += `<polygon points="${axes.map((_, i) => P(i, lv).join(',')).join(' ')}" fill="none" stroke="${lv === 1 ? 'var(--axis)' : 'var(--line)'}"/>`;
  axes.forEach((a, i) => {
    const [x, y] = P(i, 1), [lx, ly] = P(i, 1.2);
    g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;
    g += `<text x="${lx}" y="${ly + 4}" text-anchor="${Math.abs(lx - cx) < 8 ? 'middle' : lx > cx ? 'start' : 'end'}" style="fill:var(--ink2);font-size:11px">${a.e} ${esc(a.n)}</text>`;
  });
  for (const s of series) {
    const pts = s.vals.map((v, i) => P(i, v ?? 0).join(',')).join(' ');
    g += `<polygon points="${pts}" fill="${s.dash ? 'none' : s.color}" fill-opacity=".22" stroke="${s.color}" stroke-width="2" ${s.dash ? 'stroke-dasharray="4 4"' : ''} stroke-linejoin="round" style="${s.dash ? '' : `filter:drop-shadow(0 0 6px ${s.color}aa)`}"/>`;
    if (!s.dash) s.vals.forEach((v, i) => { const [x, y] = P(i, v ?? 0); g += `<circle cx="${x}" cy="${y}" r="3.5" fill="${s.color}" stroke="var(--s1)" stroke-width="2"/>`; });
  }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block;margin:0 auto;overflow:visible">${g}</svg>${legendHTML(series)}`;
}

function dotRing(c, r, p, col, dot) {
  const n = Math.max(8, Math.round(2 * Math.PI * r / (dot * 2.9))), on = Math.round(clamp(p || 0, 0, 1) * n);
  let g = '';
  for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / n; g += `<circle cx="${(c + Math.cos(a) * r).toFixed(1)}" cy="${(c + Math.sin(a) * r).toFixed(1)}" r="${dot}" fill="${col}" ${i < on ? '' : 'opacity=".16"'}/>`; }
  return g;
}
function ringsSVG(sc, size = 150) {
  const c = size / 2;
  let g = '';
  AREA_KEYS.forEach((a, i) => g += dotRing(c, c - 6 - i * 15, sc[a], AREAS[a].c, 2.6));
  g += `<text x="${c}" y="${c + 6}" text-anchor="middle" style="fill:#fff;font-size:17px;font-weight:600">${Math.round(sc.total * 100)}</text>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Puntuación ${Math.round(sc.total * 100)}%">${g}</svg>`;
}
function mix(hex, t, base = '#151517') {
  const h = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16)), a = h(hex), b = h(base);
  return '#' + a.map((v, i) => Math.round(b[i] + (v - b[i]) * t).toString(16).padStart(2, '0')).join('');
}
const RAMP_T = [.22, .4, .6, .8, 1];

function cheer(st, sc) {

  if (sc.total >= .5) return '💪 Vas muy bien hoy. Remata lo que queda.';
  if (st >= 2) return `⚡ ${st} días de racha. Hoy sumas otro.`;
  return h < 13 ? '☀️ Día nuevo, marcador a cero. A por él.' : '🚀 Cada registro cuenta. Empieza por uno.';
}

function statTile(e, name, cur, prev, unit, dec, goodUp, fmt) {

function pearson(xs, ys) {
  const n = xs.length, mx = xs.reduce((a, b) => a + b) / n, my = ys.reduce((a, b) => a + b) / n;

  for (let i = 0; i < n; i++) { const a = xs[i] - mx, b = ys[i] - my; sxy += a * b; sx += a * a; sy += b * b; }
  return sxy / Math.sqrt(sx * sy);
}

  for (let i = 0; i < ms.length; i++) for (let j = i + 1; j < ms.length; j++) {
    const xs = [], ys = [];
    for (const k of keys) { const d = S.days[k]; if (!hasData(d)) continue; const a = ms[i].get(d), b = ms[j].get(d); if (a != null && b != null) { xs.push(a); ys.push(b); } }
    if (xs.length < 7) continue;
    const r = pearson(xs, ys);
    if (isFinite(r) && Math.abs(r) >= .3) out.push({ a: ms[i], b: ms[j], r, n: xs.length });
  }
  return out.sort((x, y) => Math.abs(y.r) - Math.abs(x.r)).slice(0, 5);
}

}

}

/* ---------- deudas ---------- */
function debtCalc(x) {
  const add = sumBy(x.moves.filter(m => m.kind === 'add'), m => m.amount), paid = sumBy(x.moves.filter(m => m.kind === 'pay'), m => m.amount), total = x.initial + add;
  return { total, paid, pending: Math.max(0, total - paid), pct: total ? Math.min(1, paid / total) : 1 };
}
function payoff(x, pending) {
  let m = x.monthly;
  if (!m) { const since = addDays(today(), -90), recent = sumBy(x.moves.filter(p => p.kind === 'pay' && p.date >= since), p => p.amount); if (recent > 0) m = recent / (90 / 30.4); }
  if (!m) return null;
  const i = (x.rate || 0) / 1200; let months;
  if (i > 0) { if (m <= pending * i) return { never: true }; months = -Math.log(1 - i * pending / m) / Math.log(1 + i); }
  else months = pending / m;
  const d = new Date(); d.setMonth(d.getMonth() + Math.ceil(months));
  return { months: Math.ceil(months), date: d, interest: i > 0 ? m * months - pending : 0 };
}
function vDebts() {
  const owe = S.debts.filter(x => x.kind === 'owe'), owed = S.debts.filter(x => x.kind === 'owed');
  const T = a => a.reduce((s, x) => { const c = debtCalc(x); s.total += c.total; s.paid += c.paid; s.pending += c.pending; return s; }, { total: 0, paid: 0, pending: 0 });
  const to = T(owe), tw = T(owed);
  const open = owe.filter(x => debtCalc(x).pending > 0), pays = open.map(x => payoff(x, debtCalc(x).pending));
  const free = !owe.length ? null : !open.length ? 'done' : pays.some(p => !p || p.never) ? null : pays.reduce((a, p) => p.date > a ? p.date : a, new Date(0));
  const card = x => {

    if (dt.getDate() === 1) { d.tx.push({ id: uid(), type: 'in', cat: c.incomeCats[0].id, amount: 1850, note: 'Nómina' }); d.tx.push({ id: uid(), type: 'out', cat: (cats.find(x => x.name === 'Casa') || cats[0]).id, amount: 650, note: 'Alquiler' }); }
    if (Math.random() < .06) d.tx.push({ id: uid(), type: 'in', cat: c.incomeCats[1]?.id || c.incomeCats[0].id, amount: Math.round(40 + Math.random() * 160), note: 'Venta Wallapop' });
    if (!d.tx.length) d.noSpend = true;
    if (Math.random() < .3) d.note = pick(notes);
    // deporte: empezó a correr hace ~12 semanas, progresando
    if ([2, 4, 0].includes(dow) && i < 84 && Math.random() < .85) {
      const prog = (84 - i) / 84, long = dow === 0, dist = Math.round((long ? 5 + prog * 6 : 3 + prog * 3.5) * (.9 + Math.random() * .2) * 100) / 100;
      const pace = 400 - prog * 50 + (long ? 15 : 0) + gauss() * 8;
      d.workouts = [{ id: uid(), sport: 'run', type: long ? 'Tirada larga' : dow === 4 && Math.random() < .5 ? 'Series' : 'Rodaje', dist, dur: Math.round(dist * pace), feel: clamp(Math.round(3.4 + gauss()), 1, 5), shoe: shoe?.id }];
      d.exercise = Math.round(dist * pace / 60);
    } else if ([1, 3].includes(dow) && Math.random() < .7) {
      d.workouts = [{ id: uid(), sport: 'gym', dur: 3600 + Math.round(gauss() * 500), feel: 4 }];
      d.exercise = Math.round(d.workouts[0].dur / 60);
    }
    // trading
    d.trades = [];
    if (!we && man && Math.random() < .75) {
      for (let t = 0, nt = 1 + Math.floor(Math.random() * 3); t < nt; t++) {
        const plan = Math.random() < .7 + (d.sleep - 7) * .08, win = Math.random() < (plan ? .58 : .36);
        const r = win ? +(0.8 + Math.random() * 2).toFixed(1) : -(plan ? 1 : +(1 + Math.random() * 1.5).toFixed(1));
        d.trades.push({ id: uid(), acc: man.id, kind: 'manual', pnl: Math.round(r * 50 * 100) / 100, r, sym: pick(syms), side: Math.random() < .6 ? 'long' : 'short', setup: pick(c.setups).id, plan, emo: plan ? pick(['calm', 'calm', 'conf']) : pick(['revenge', 'fomo', 'greed', 'fear']) });
      }
    }
    for (const p of propsD) if (!we && i < (p.phase === 'funded' ? 60 : 25) && Math.random() < .7) { const win = Math.random() < .62, r = win ? +(0.8 + Math.random() * 2).toFixed(1) : -1; d.trades.push({ id: uid(), acc: p.id, kind: 'manual', pnl: Math.round(p.capital * .004 * r), r, sym: pick(syms), side: Math.random() < .6 ? 'long' : 'short', setup: pick(c.setups).id, plan: true, emo: 'calm' }); }
    for (const b of bots) d.trades.push({ id: uid(), acc: b.id, kind: 'bot', pnl: Math.round(b.capital * (.0011 + gauss() * .006) * 100) / 100 });
    if (!d.trades.length) delete d.trades;
    if (i === 0) { delete d.habits; delete d.tx; delete d.noSpend; delete d.note; delete d.water; delete d.steps; delete d.weight; d.water = 3; }
    days[k] = d;
  }
  return days;
}

    if (!M.date || M.date > today()) { toast('Fecha no válida'); return 'stay'; }
    const type = isProp(a) ? 'wd' : M.type, m = { id: uid(), date: M.date, type, amount: amt };
    if (isProp(a) && a.split) m.gross = Math.round(amt / (a.split / 100) * 100) / 100;
    (a.moves = a.moves || []).push(m);
    toast(type === 'wd' ? `💸 ¡Retiro de ${tm(amt)} cobrado! Disfrútalo 🎉` : `➕ Depósito de ${tm(amt)} registrado`);
    U.mv.open = false; return true;
  },
  mvDel: t => { const a = S.config.accounts.find(x => x.id === t.dataset.v); if (!a || !confirm('¿Borrar este movimiento?')) return 'stay'; a.moves = (a.moves || []).filter(m => m.id !== t.dataset.k); return true; },
  accDel: t => {
    const id = t.dataset.v, n = allOf('trades').filter(x => x.acc === id).length;
    if (!confirm(n ? `¿Borrar la cuenta y sus ${n} registros?` : '¿Borrar la cuenta?')) return 'stay';
    S.config.accounts = S.config.accounts.filter(a => a.id !== id);
    for (const k in S.days) { const d = S.days[k]; if (d.trades) { d.trades = d.trades.filter(x => x.acc !== id); if (!d.trades.length) delete d.trades; if (!hasData(d)) delete S.days[k]; } }
    if (U.trAcc === id) U.trAcc = 'all'; return true;
  },
  wipe: () => { if (!confirm('¿Borrar TODOS tus datos y ajustes? No se puede deshacer.')) return 'stay'; if (!confirm('¿Seguro? Si no tienes copia, se perderá todo.')) return 'stay'; localStorage.removeItem(KEY); load(); U.cur = today(); return true; },
};

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-a],[data-tab]');
  if (!t) return;
  if (t.dataset.tab) { U.tab = t.dataset.tab; render(); scrollTo(0, 0); return; }
  const fn = ACTIONS[t.dataset.a]; if (!fn) return;
  const r = await fn(t);
  if (r === 'stay') return;
  if (r === true) checkUnlocks();
  render();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f) {
    let v = t.value;
    if ('num' in t.dataset) { v = v.trim().replace(',', '.'); v = v === '' ? null : parseFloat(v); if (v != null && isNaN(v)) return; }
    setVal(U.cur, t.dataset.f, v); saveSoon(); renderHero();
  } else if (t.dataset.u) {
    setU(t.dataset.u, t.value);
    if (t.dataset.u.startsWith('wk.') && $('#wkPace')) $('#wkPace').textContent = wkPreview();
    if ('rr' in t.dataset) render();
  } else if (t.id === 'txAmt') U.txAmt = t.value;
  else if (t.id === 'txNote') U.txNote = t.value;
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.f) checkUnlocks();
  else if (t.dataset.sel) { U[t.dataset.sel] = t.value; render(); }
  else if (t.dataset.cfgs) { S.config[t.dataset.cfgs] = t.value; save(); render(); toast('✔️ Guardado'); }
  else if (t.dataset.cfg) {
    const v = num(t.value);
    if (!('zero' in t.dataset ? v >= 0 : v > 0)) { toast('Valor no válido'); render(); return; }
    const [a, b] = t.dataset.cfg.split('.');
    if (b) S.config[a][b] = v; else S.config[a] = v;
    save(); toast('✔️ Guardado');
  } else if (t.id === 'importFile' && t.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const o = JSON.parse(r.result);
        if (!o || typeof o.days !== 'object') throw 0;
        if (!confirm(`Importar copia con ${Object.keys(o.days).length} días. Esto reemplaza los datos actuales. ¿Continuar?`)) return;
        S = normalize(o); save(); checkUnlocks(true); U.cur = today(); render(); toast('✅ Copia importada');
      } catch (_) { toast('❌ Ese archivo no es una copia válida'); }
      t.value = '';
    };
    r.readAsText(t.files[0]);
  }
});

/* ---------- render ---------- */
function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === U.tab));
  const v = $('#view');
  const seg = (a, cur, opts) => `<div class="rangeseg">${opts.map(([val, l]) => `<button class="${cur === val ? 'on' : ''}" data-a="${a}" data-v="${val}">${l}</button>`).join('')}</div>`;
  if (U.tab === 'hoy') { v.innerHTML = vHoy(); renderHero(); }
  else if (U.tab === 'trends') {
    v.innerHTML = `<h1>Análisis</h1>${seg('statsView', U.statsView, [['charts', '📈 Gráficas'], ['cal', '🗓️ Calendario']])}` + (U.statsView === 'cal' ? vCal() : vTrends());
    if (U.statsView !== 'cal') mountTrends();
  }
  else if (U.tab === 'sport') { v.innerHTML = vSport(); mountSport(); }
  else if (U.tab === 'money') {
    v.innerHTML = `<h1>Dinero</h1>${seg('moneyView', U.moneyView, [['month', '📅 Mes'], ['debts', '💳 Deudas']])}` + (U.moneyView === 'debts' ? vDebts() : vMoney());
    U.moneyView === 'debts' ? mountDebts() : mountMoney();
  }
  else if (U.tab === 'trading') { v.innerHTML = vTrading(); mountTrading(); }
  else v.innerHTML = vMe();
}
let lastW = innerWidth;
addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) > 40 && ['trends', 'money', 'sport', 'trading'].includes(U.tab)) { lastW = innerWidth; render(); } });
// al volver a la app otro día, salta a hoy
document.addEventListener('visibilitychange', () => { if (!document.hidden && U.tab === 'hoy' && U.cur < today() && U.lastSeen !== today()) { U.cur = today(); render(); } U.lastSeen = today(); });

U.lastSeen = today();
load();
// una demo creada con una versión anterior no tiene deporte/trading/deudas: se regenera
if (S.demo && !S.config.accounts.some(a => a.demo && a.kind === 'prop')) ACTIONS.demo();
checkUnlocks(true);
render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
